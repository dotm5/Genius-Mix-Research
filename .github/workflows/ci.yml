name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Tools (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile the tools
        run: python -m compileall -q tools
      - name: Run every CLI entry point with --help
        run: |
          for tool in tools/*.py; do
            echo "== $tool"
            python "$tool" --help > /dev/null
          done
